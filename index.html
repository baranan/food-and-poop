<!doctype html>
<!--
  Application shell.

  Everything visible is built by js/app.js; this file exists to define the small
  number of fixed slots those modules write into, and to get the language and
  direction right before the first paint.

  ?mock=1 runs against localStorage instead of the sheet. ?debug=1 opens the log
  panel, which can also be reached by long-pressing the title.
-->
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#f6f7f9" />

    <!-- Lets the app open full-screen once added to a phone's home screen. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="אוכל וקקי" />

    <title>אוכל וקקי</title>

    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="icons/icon-192.png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />

    <link rel="stylesheet" href="css/app.css" />
  </head>

  <body>
    <!-- Filled only in mock mode. -->
    <div id="banner"></div>

    <div class="app">
      <header class="header">
        <h1 id="title">אוכל וקקי</h1>
        <button id="who" class="who" type="button">מי?</button>
      </header>

      <!-- Every screen is rendered here by the router. -->
      <main id="outlet"></main>
    </div>

    <!-- Pinned to the bottom; the only place the app admits writing takes time. -->
    <div id="sync" class="sync-bar">טוען…</div>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
